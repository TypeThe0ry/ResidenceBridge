# =====================================================
#  ResidenceBridge 配置文件
#  GitHub: https://github.com/TypeThe0ry/ResidenceBridge
# =====================================================

# 当前子服的唯一标识符
# 不同子服必须配置不同的值，建议使用小写字母、数字和连字符
# 例如：survival-1、creative、skyblock
server-id: "survival-1"

# ─── MySQL 数据库 ──────────────────────────────────
mysql:
  host: "127.0.0.1"
  port: 3306
  database: "minecraft"
  username: "root"
  password: "password"
  # HikariCP 连接池最大连接数，一般 5-10 即可
  maximum-pool-size: 10

# ─── 领地数据同步 ─────────────────────────────────
sync:
  # 服务器启动后延迟多少 tick 开始首次同步（20 tick = 1 秒）
  # 适当延迟可等待 Residence 插件加载完毕
  initial-delay-ticks: 40
  # 每隔多少秒将本服领地数据同步至 MySQL
  interval-seconds: 60
  # 每次同步成功后是否在控制台输出日志（调试时可开启）
  log-success: false

# ─── 跨服传送 ────────────────────────────────────
teleport:
  # 跨服传送请求的有效期（秒）
  # 玩家必须在此时间内成功进入目标服，否则传送请求失效
  pending-expire-seconds: 30
  # 玩家进入目标服后延迟多少 tick 再执行远程操作；跨服传送会立即尝试并自动短间隔重试
  join-delay-ticks: 0
  # 按权限设置 /res tp 等待时间，拥有多个权限时取最短等待时间
  # LuckPerms 示例：/lp group vip permission set reslink.tp.vip true
  # 管理员/OP 或拥有 bypass-permission 的玩家会跳过等待
  wait:
    enabled: true
    default-seconds: 3
    bypass-permission: "residencebridge.teleport.bypass"
    cancel-on-move: true
    cancel-on-damage: true
    # 每秒倒计时提示音；填空字符串可关闭
    countdown-sound: "BLOCK_NOTE_BLOCK_PLING"
    countdown-sound-volume: 1.0
    countdown-sound-pitch: 1.2
    groups:
      default:
        permission: "ResLinkDefault"
        seconds: 3
      vip:
        permission: "reslink.tp.vip"
        seconds: 1
      bypass:
        permission: "residencebridge.teleport.bypass"
        seconds: 0

# ─── 全区领地数量限制 ─────────────────────────────
# 拥有多个权限时取最大上限；拥有 bypass-permission 时不限制数量
# LuckPerms 示例：/lp group vip permission set reslink.count.vip true
limits:
  default-max-residences: 3
  bypass-permission: "residencebridge.limit.bypass"
  groups:
    default:
      permission: "ResLinkDefaultCount"
      max-residences: 3
    vip:
      permission: "reslink.count.vip"
      max-residences: 10
    svip:
      permission: "reslink.count.svip"
      max-residences: 30

# ─── 语言 ─────────────────────────────────────────
# 玩家消息位于 lang/ 目录；可使用 MiniMessage 格式。
language:
  default-locale: zh_CN
  follow-client: true

# ─── /res list 全区列表 ───────────────────────────
list:
  page-size: 8
  # 管理员可使用 /res list <玩家名> [页码] 查看其他玩家的全服领地
  others-permission: "residencebridge.list.others"

# 这些指令在本服找不到领地时，会根据全局索引切换到领地所在服务器后自动执行
remote-action-commands:
  - "rename"
  - "give"
  - "remove"
  - "delete"

# ─── PlaceholderAPI ──────────────────────────────
placeholder:
  # 支持：%reslink_ressize%、%reslink_reslist_1%、%reslink_reslist_2% ...
  cache-seconds: 30

# ─── Velocity / BungeeCord 消息频道 ──────────────
velocity:
  # Velocity 插件消息频道名称（需与代理端配置一致）
  channel: "residencebridge:main"
  # 是否同时发送 BungeeCord 格式的连接消息
  # 使用 BungeeCord 代理时请保持 true；纯 Velocity 环境可设为 false
  fallback-bungee-channel: true
  # 等待代理确认目标服务器存在且在线的最长时间（tick）
  server-status-timeout-ticks: 60

# 玩家与管理员消息请在 plugins/ResidenceBridge/lang/ 中修改。
# 升级旧版本时，原 list/messages 自定义文案会自动迁移一次。
